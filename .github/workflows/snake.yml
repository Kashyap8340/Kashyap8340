name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Kashyap8340
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00ff88&color_dots=#ebedf0,#b7f7d0,#69e89b,#22c55e,#0b8f45
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00ff88&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
